# =============================================================================
# Temporal Graph Network - Configuration File
# =============================================================================
# This file will be populated with your specific parameters as we build the system.
# Currently contains placeholders - DO NOT USE YET.
#
# You will provide specifications for:
# - Network topology (machines, users, IPs)
# - Data sources and formats
# - Model hyperparameters
# - Training settings
# =============================================================================

# System Configuration
system:
  device: "cuda"  # Your RTX 4050 GPU
  cuda_version: "13.1"
  seed: 42  # For reproducibility
  num_workers: 4  # Data loading workers

# Project Paths
paths:
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  synthetic_data: "data/synthetic"
  models_dir: "models"
  logs_dir: "logs"
  checkpoints_dir: "checkpoints"

# Data Configuration
data:
  source: "real"  # Options: "real", "synthetic", "public_dataset"
  format: "csv"
  dataset_name: "UNSW-NB15"
  time_window: "1h"
  contract_path: "configs/dataset_contract.yaml"
  columns_path: "configs/unsw_nb15_columns.txt"

# Model Configuration
model:
  name: "EdgeBaselineMLP"
  input_features:
    - edge_event_count
    - anomaly_event_count
    - total_bytes_sent
    - total_bytes_received
  hidden_dim: 32
  dropout: 0.1
  model_path: "models/edge_baseline.pt"
  metadata_path: "models/edge_baseline_metadata.json"
  
# Training Configuration
training:
  epochs: 5
  batch_size: 512
  learning_rate: 0.001
  train_split_path: "data/processed/splits/train_edges.csv"
  val_split_path: "data/processed/splits/val_edges.csv"
  test_split_path: "data/processed/splits/test_edges.csv"
  metrics_output: "data/processed/metrics/baseline_metrics.json"
  
# Inference Configuration
inference:
  input_path: "data/processed/splits/test_edges.csv"
  output_path: "data/processed/inference/scored_edges.csv"
  threshold_override: null

# Reporting
reporting:
  graph_sanity_summary: "data/processed/graph_sanity_summary.json"
  pipeline_run_report: "data/processed/reports/pipeline_run_report.json"
