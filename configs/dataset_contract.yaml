# Dataset Contract for Network Events
# Fill this file with your real dataset details before ingestion starts.

metadata:
  dataset_name: UNSW-NB15
  source_owner: UNSW Canberra Cyber
  format: csv            # csv | parquet | jsonl
  timezone: UTC          # e.g., UTC
  time_unit: s           # s | ms | us | ns
  has_header: false

paths:
  train_file: data/raw/unsw_nb15/UNSW-NB15_1.csv
  validation_file: data/raw/unsw_nb15/UNSW-NB15_2.csv
  test_file: data/raw/unsw_nb15/UNSW-NB15_3.csv

schema:
  column_names_file: configs/unsw_nb15_columns.txt
  required_columns:
    timestamp: Stime       # column name in your dataset
    src_ip: srcip
    dst_ip: dstip
    src_user: null
    dst_user: null
    event_type: state
    protocol: proto

  optional_columns:
    src_host: null
    dst_host: null
    src_port: sport
    dst_port: dsport
    bytes_sent: sbytes
    bytes_received: dbytes
    auth_result: null
    session_id: null

labels:
  label_column: label      # optional for supervised setup
  positive_class: 1        # e.g., anomaly

privacy:
  contains_pii: null
  masking_required: null
  approved_for_training: null
